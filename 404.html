<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found — Songyin Hou</title>
  <style>
    :root { color-scheme: light dark; --paper:#f7f5f0; --ink:#303d49; --accent:#284c43; --on:#fff; }
    @media (prefers-color-scheme:dark) { :root { --paper:#1d242c; --ink:#e8e5df; --accent:#a8b9a5; --on:#15241e; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; box-sizing:border-box; background:var(--paper); color:var(--ink); font:1rem/1.6 system-ui,sans-serif; }
    main { width:min(100%,36rem); border-top:2px solid var(--accent); padding-block:20px; }
    h1 { font:clamp(2.5rem,8vw,5rem)/1.05 Georgia,serif; margin:0; }
    a { display:inline-block; padding:12px 18px; background:var(--accent); color:var(--on); border-radius:8px; }
    a:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
  </style>
</head>
<body><main><p>404</p><h1>Page not found</h1><p>The page may have moved. Return to the portfolio to find research, publications and projects.</p><a href="/">Return to portfolio</a></main></body>
</html>
